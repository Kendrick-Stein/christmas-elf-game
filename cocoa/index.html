<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#251b30"><title>雪夜可可铺</title><link rel="stylesheet" href="./style.css?v=cocoa-27"><script defer src="../audio.js?v=audio-21" data-mode="tree"></script><script defer src="./core.js?v=cocoa-27"></script><script defer src="./app.js?v=cocoa-27"></script></head><body>
<main>
<header><a class="home" href="../" data-t="home">首页</a><div><span class="label" data-t="brand">松针雪夜 · 冬日街机</span><h1 data-t="title">雪夜可可铺</h1></div><div class="tools"><details id="audioSettings"><summary id="soundLabel" data-t="sound">声音</summary><div><label><input type="checkbox" id="music" checked><span data-t="music">背景音乐</span></label><label><input type="checkbox" id="sfx" checked><span data-t="sfx">操作音效</span></label></div></details><button id="language" aria-label="Switch to English">EN</button><button id="pause" data-t="pause" hidden>暂停</button></div></header>
<section class="hud"><div><small data-t="money">营业额</small><output id="money">0</output></div><div><small data-t="streak">连单</small><output id="streak">0</output></div><div><small data-t="fails">连续失手</small><output id="fails">0 / 3</output></div><div><small data-t="best">纪录</small><output id="best">0</output></div></section>
<section class="scene" aria-hidden="true"><div class="skyArt"></div><div class="awning"></div><div class="shopSign">✦ COCOA ✦</div><div id="patron"></div><div class="counter"></div><div class="cup"><div class="steam"><i></i><i></i><i></i></div><div id="liquid"></div><span id="garnish"></span></div></section>
<div id="overlay" class="overlay" data-screen="ready"><div><p class="label" data-t="brand">松针雪夜 · 冬日街机</p><h2 id="banner"></h2><p id="intro"></p><div class="honors" id="honors" hidden><div><span data-t="money">营业额</span><output id="finalMoney">0</output></div><div><span data-t="served">完成</span><output id="finalServed">0</output></div><div><span data-t="tips">小费</span><output id="finalTips">0</output></div></div><p id="breakdown" hidden></p><button id="start" class="gold"></button><button id="restart" data-t="retry" hidden>重新开局</button><button id="skipAnimation" data-t="skip" hidden>跳过动画</button></div></div>
<section id="kitchen" inert>
<div class="section-title"><h2 data-t="orders">顾客订单</h2><span data-t="orderKeys">订单键 1–6</span></div><div id="orders"></div>
<div class="section-title"><h2 data-t="cups">备餐台 · 四杯</h2><span data-t="cupKeys">杯位键 7、8、9、0</span></div><div id="cups"></div>
<div class="bench"><div class="section-title"><h2 data-t="mix">调制台</h2><span id="formula"></span></div><p id="reaction" class="label" hidden></p><div id="ingredients"></div></div>
<div class="actions"><button id="seal" class="gold" data-t="seal">做好放台面</button><button id="serve" data-t="serve">选择顾客递杯</button></div>
</section><p id="feedback" role="status" aria-live="polite"></p>
</main></body></html>
