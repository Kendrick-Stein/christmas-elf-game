<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14182c">
  <title>礼物仓保卫战暂时下线 | Gift Depot Defense</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 21%,#32445b,transparent 65%),#14182c;color:#fff1d8;font:500 1rem/1.5 system-ui,sans-serif}
    main{width:min(100%,440px);padding:clamp(20px,6vw,34px);background:#20283c;border:2px solid #a38463;border-radius:14px;text-align:center;box-shadow:0 6px #101526}
    .star{color:#ffd391;font-size:2rem;line-height:1}
    h1{margin:12px 0 3px;font-size:clamp(1.4rem,6vw,2rem)}
    .translated{margin:0;color:#eecea8;font-size:.95rem}
    .note{margin:16px 0 20px;color:#eadccf}
    .note span{display:block;color:#d2ccd1;font-size:.9rem}
    a{display:inline-grid;align-content:center;min-height:46px;padding:8px 15px;border-radius:7px;background:#ffd391;color:#322638;font-weight:750;text-decoration:none}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="star" aria-hidden="true">✦</div>
    <h1>礼物仓保卫战暂时下线</h1>
    <p class="translated" lang="en">Gift Depot Defense is temporarily offline</p>
    <p class="note">其他圣诞小游戏仍可游玩。<span lang="en">The other Christmas games are still available.</span></p>
    <a href="../">返回圣诞小游戏首页 <span lang="en">Back to the Christmas Arcade</span></a>
  </main>
</body>
</html>
