<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"><meta name="theme-color" content="#122134"><title>造树工坊 · 松针雪夜</title><link rel="stylesheet" href="style.css"><script defer src="model.js"></script><script defer src="art.js"></script><script defer src="workshop.js?v=gingerbread-20"></script></head>
<body>
<header class="mast"><div><p class="eyebrow">PINE &amp; SNOW</p><h1 data-i18n="brand">造树工坊</h1></div><div class="header-actions"><a id="backStandalone" href="../" data-i18n="back" hidden>返回游戏</a><button id="language" aria-label="切换语言">🌐 English</button><button id="export" class="sun" data-i18n="export">保存 PNG</button></div></header>
<main class="workbench">
<section class="stage" aria-labelledby="stageTitle"><div class="stage-head"><h2 id="stageTitle" data-i18n="myTree">我的圣诞树</h2><span id="layerCount"></span></div><canvas id="tree" width="640" height="680" aria-label="圣诞树画布"></canvas><p class="hint" id="stageHint" aria-live="polite"></p></section>
<section class="tools" aria-label="编辑工具">
 <div class="tool-heading"><div class="eyebrow" data-i18n="workbench">WORKBENCH</div><h2 data-i18n="customize">搭一棵自己的树</h2></div>
 <div id="tabs" class="tabs" role="tablist" aria-label="编辑类别"><button role="tab" id="tab-layer" aria-selected="true" aria-controls="panel-layer" data-tab="layer" data-i18n="layers">松枝</button><button role="tab" id="tab-deco" aria-selected="false" aria-controls="panel-deco" data-tab="deco" data-i18n="decor">挂饰</button><button role="tab" id="tab-photo" aria-selected="false" aria-controls="panel-photo" data-tab="photo" data-i18n="photo">照片</button></div>
 <section id="panel-layer" class="tool-panel" role="tabpanel" aria-labelledby="tab-layer"><p class="muted" data-i18n="aboutLayers">点树枝选层，每层可以用不同宽度。</p><div id="layerButtons"></div><label for="width" class="labeled"><span data-i18n="width">松枝宽度</span><strong id="widthValue"></strong></label><input id="width" type="range" min="48" max="260" step="1"><div class="cluster" id="presets"><button data-size="84" data-i18n="small">小</button><button data-size="145" data-i18n="medium">中</button><button data-size="210" data-i18n="large">大</button></div><div class="cluster layer-actions"><button id="grow" data-i18n="addLayer">＋ 加一层</button><button id="prune" data-i18n="deleteLayer">删掉这层</button></div></section>
 <section id="panel-deco" class="tool-panel" role="tabpanel" aria-labelledby="tab-deco" hidden><p class="muted" data-i18n="aboutDecor">先选挂饰，再点松枝挂上去。</p><div id="swatches" class="swatches"></div><div class="cluster layer-actions"><button id="hangDecor" data-i18n="hangSelected">挂到所选层</button><button id="unhang" data-i18n="deleteLast">移除该层最后一件</button></div></section>
 <section id="panel-photo" class="tool-panel" role="tabpanel" aria-labelledby="tab-photo" hidden><p class="muted" data-i18n="localPhoto">建议用白底照片。只在本机转换，不会上传。</p><label for="photoFile" class="fileLabel" data-i18n="choosePhoto">选择照片</label><input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp" aria-label="选择照片"><label class="checkbox"><input type="checkbox" checked id="removeWhite"><span data-i18n="removeWhite">去掉边缘相连的白底</span></label><div id="photoPreview" hidden><canvas id="photoSample" width="26" height="26" aria-label="像素照片预览"></canvas><p class="muted" id="photoInfo"></p></div><div class="cluster"><button id="hangPhoto" disabled data-i18n="hangPhoto">把照片挂到所选层</button><button id="unhangPhoto" disabled data-i18n="unhangPhoto">移除该层照片</button></div></section>
 <footer class="tool-footer"><button id="undo" disabled data-i18n="undo">↶ 撤销</button><span id="status" role="status" aria-live="polite"></span></footer>
</section>
</main>
</body></html>
